          <text x="958" y="114" text-anchor="middle" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11" font-weight="700" fill="#FFFFFF">F</text>
          <text x="980" y="114" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">product_id</text>
          <text x="1162" y="114" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">int &#183; unique</text>

          <text x="980" y="138" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">quantity</text>
          <text x="1162" y="138" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">int &#183; default 1</text>
        </g>

        <!-- products (central) -->
        <g>
          <rect x="460" y="280" width="280" height="214" rx="10" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.8" />
          <rect x="460" y="280" width="280" height="34" rx="10" fill="#EEF0F5" />
          <rect x="460" y="304" width="280" height="10" fill="#EEF0F5" />
          <line x1="460" y1="314" x2="740" y2="314" stroke="#D7DBE3" stroke-width="1.4" />
          <text x="478" y="302" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="15" font-weight="700" fill="#1A2030">products</text>

          <rect x="478" y="316" width="20" height="20" rx="5" fill="#0E7C86" />
          <text x="488" y="330" text-anchor="middle" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11" font-weight="700" fill="#FFFFFF">P</text>
          <text x="510" y="330" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">id</text>
          <text x="722" y="330" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">serial</text>

