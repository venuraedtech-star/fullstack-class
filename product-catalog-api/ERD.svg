          <text x="508" y="272" fill="#0E7C86">1</text>
          <text x="862" y="102" fill="#9C6B0A" text-anchor="end">0..1</text>

          <text x="550" y="518" fill="#0E7C86">1</text>
          <text x="550" y="562" fill="#9C6B0A">0..N</text>

