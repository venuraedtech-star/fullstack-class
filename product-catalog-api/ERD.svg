          <text x="980" y="644" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">name</text>
          <text x="1132" y="644" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">text &#183; unique</text>
        </g>

      
  </g>

  <line x1="40" y1="812" x2="1200" y2="812" stroke="#D7DBE3" stroke-width="1" />

  <g font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace">
    <rect x="40" y="836" width="18" height="18" rx="4" fill="#0E7C86" />
    <text x="49" y="849" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">P</text>
    <text x="66" y="849" font-size="12.5" fill="#636B7A">primary key</text>

    <rect x="190" y="836" width="18" height="18" rx="4" fill="#9C6B0A" />
    <text x="199" y="849" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">F</text>
    <text x="216" y="849" font-size="12.5" fill="#636B7A">foreign key</text>

    <text x="350" y="849" font-size="12.5" fill="#636B7A"><tspan font-weight="700" fill="#1A2030">1</tspan> exactly one   <tspan font-weight="700" fill="#1A2030">0..1</tspan> zero or one   <tspan font-weight="700" fill="#1A2030">0..N</tspan> zero or more</text>

    <text x="40" y="882" font-size="12" fill="#636B7A">products &#8594; cart_items is <tspan font-weight="700" fill="#1A2030">0..1</tspan>, not 0..N &#8212; product_id is UNIQUE, so re-adding increments quantity instead of a second row.</text>
    <text x="40" y="904" font-size="12" fill="#636B7A">product_tags has no id of its own &#8212; (product_id, tag_id) together are its primary key, which is what makes it a real many-to-many junction.</text>
  </g>

</svg>
