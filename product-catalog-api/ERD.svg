          <text x="487" y="643" text-anchor="middle" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF">P</text>
          <rect x="500" y="630" width="18" height="18" rx="4" fill="#9C6B0A" />
          <text x="509" y="643" text-anchor="middle" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF">F</text>
          <text x="526" y="644" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">tag_id</text>
          <text x="682" y="644" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">int</text>
