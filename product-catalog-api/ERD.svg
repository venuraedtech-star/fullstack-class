          <rect x="930" y="594" width="220" height="10" fill="#EEF0F5" />
          <line x1="930" y1="604" x2="1150" y2="604" stroke="#D7DBE3" stroke-width="1.4" />
          <text x="948" y="592" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="15" font-weight="700" fill="#1A2030">tags</text>

          <rect x="948" y="606" width="20" height="20" rx="5" fill="#0E7C86" />
          <text x="958" y="620" text-anchor="middle" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11" font-weight="700" fill="#FFFFFF">P</text>
          <text x="980" y="620" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">id</text>
