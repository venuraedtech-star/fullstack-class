          <text x="722" y="354" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">text</text>

          <text x="510" y="378" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">price</text>
          <text x="722" y="378" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">numeric(10,2)</text>

          <rect x="478" y="388" width="20" height="20" rx="5" fill="#9C6B0A" />
          <text x="488" y="402" text-anchor="middle" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11" font-weight="700" fill="#FFFFFF">F</text>
          <text x="510" y="402" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">category_id</text>
          <text x="722" y="402" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">int &#183; null</text>

          <text x="510" y="426" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">description</text>
          <text x="722" y="426" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">text &#183; null</text>

          <text x="510" y="450" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">created_at</text>
          <text x="722" y="450" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">timestamp(3)</text>

          <text x="510" y="474" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">image_url</text>
          <text x="722" y="474" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">text &#183; null</text>
        </g>

        <!-- product_tags (junction) -->
        <g>
          <rect x="460" y="570" width="240" height="94" rx="10" fill="#FFFFFF" stroke="#9C6B0A" stroke-width="1.8" />
          <rect x="460" y="570" width="240" height="34" rx="10" fill="#EEF0F5" />
          <rect x="460" y="594" width="240" height="10" fill="#EEF0F5" />
          <line x1="460" y1="604" x2="700" y2="604" stroke="#D7DBE3" stroke-width="1.4" />
          <text x="478" y="592" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="15" font-weight="700" fill="#1A2030">product_tags</text>
          <text x="682" y="565" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.06em" fill="#9C6B0A">JUNCTION TABLE</text>

          <rect x="478" y="606" width="18" height="18" rx="4" fill="#0E7C86" />
          <text x="487" y="619" text-anchor="middle" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF">P</text>
          <rect x="500" y="606" width="18" height="18" rx="4" fill="#9C6B0A" />
          <text x="509" y="619" text-anchor="middle" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF">F</text>
          <text x="526" y="620" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="13" font-weight="500" fill="#1A2030">product_id</text>
          <text x="682" y="620" text-anchor="end" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11.5" fill="#636B7A">int</text>

