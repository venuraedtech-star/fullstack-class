<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 930" role="img" aria-label="Entity-relationship diagram of the product_catalog database: categories connects one-to-many to products, optional; products connects one-to-zero-or-one to cart_items; products and tags each connect one-to-many into the product_tags junction table, which has no id column of its own and uses the composite primary key product_id, tag_id to implement a true many-to-many relationship between products and tags.">

  <rect x="0" y="0" width="1240" height="930" fill="#FFFFFF" />

  <text x="40" y="38" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#0E7C86">PRODUCT-CATALOG-API &#183; POSTGRESQL &#183; PUBLIC SCHEMA</text>
  <text x="40" y="68" font-family="ui-monospace, &apos;SF Mono&apos;, &apos;Cascadia Code&apos;, Consolas, monospace" font-size="26" font-weight="700" fill="#1A2030">Entity&#8211;relationship diagram</text>

  <g transform="translate(0,90)">


        <defs>
          <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
            <circle cx="4" cy="4" r="2.5" fill="currentColor" />
          </marker>
        </defs>

        <g fill="none" stroke="#B9C0CC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
