name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: product-catalog-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm test

  deploy-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI passed — safe to deploy this commit."
